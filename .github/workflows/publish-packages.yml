name: Publish NuGet Packages

on:
  push:
    branches: [master]
    paths:
      - 'Shared.Domain/**'
      - 'Shared.Infra/**'
      - 'Shared.Application/**'
      - 'Shared.Api/**'
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  GITHUB_FEED: https://nuget.pkg.github.com/ionut1912/index.json
  NUGET_AUTH_TOKEN: ${{ secrets.NUGET_PAT }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  packages: write
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      domain:      ${{ steps.filter.outputs.domain }}
      infra:       ${{ steps.filter.outputs.infra }}
      application: ${{ steps.filter.outputs.application }}
      api:         ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 2

      - name: Detect changed packages
        id: filter
        uses: dorny/paths-filter@v3.0.2
        with:
          filters: |
            domain:
              - 'Shared.Domain/**'
            infra:
              - 'Shared.Infra/**'
            application:
              - 'Shared.Application/**'
            api:
              - 'Shared.Api/**'

  publish-domain:
    needs: detect-changes
    if: needs.detect-changes.outputs.domain == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      NUGET_AUTH_TOKEN: ${{ secrets.NUGET_PAT }}
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore Shared.Domain/Shared.Domain.csproj

      - name: Build
        run: dotnet build Shared.Domain/Shared.Domain.csproj --configuration Release --no-restore

      - name: Pack
        run: dotnet pack Shared.Domain/Shared.Domain.csproj --configuration Release --no-build --output ./nupkg

      - name: Push
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --source "${{ env.GITHUB_FEED }}" \
            --api-key "${{ secrets.NUGET_PAT }}" \
            --skip-duplicate

  publish-infra:
    needs: [detect-changes, publish-domain]
    if: |
      always() &&
      !failure() &&
      !cancelled() &&
      (needs.detect-changes.outputs.infra == 'true' ||
       needs.detect-changes.outputs.domain == 'true' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      NUGET_AUTH_TOKEN: ${{ secrets.NUGET_PAT }}
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore Shared.Infra/Shared.Infra.csproj

      - name: Build
        run: dotnet build Shared.Infra/Shared.Infra.csproj --configuration Release --no-restore

      - name: Pack
        run: dotnet pack Shared.Infra/Shared.Infra.csproj --configuration Release --no-build --output ./nupkg

      - name: Push
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --source "${{ env.GITHUB_FEED }}" \
            --api-key "${{ secrets.NUGET_PAT }}" \
            --skip-duplicate

  publish-application:
    needs: [detect-changes, publish-infra]
    if: |
      always() &&
      !failure() &&
      !cancelled() &&
      (needs.detect-changes.outputs.application == 'true' ||
       needs.detect-changes.outputs.infra == 'true' ||
       needs.detect-changes.outputs.domain == 'true' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      NUGET_AUTH_TOKEN: ${{ secrets.NUGET_PAT }}
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore Shared.Application/Shared.Application.csproj

      - name: Build
        run: dotnet build Shared.Application/Shared.Application.csproj --configuration Release --no-restore

      - name: Pack
        run: dotnet pack Shared.Application/Shared.Application.csproj --configuration Release --no-build --output ./nupkg

      - name: Push
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --source "${{ env.GITHUB_FEED }}" \
            --api-key "${{ secrets.NUGET_PAT }}" \
            --skip-duplicate

  publish-api:
    needs: [detect-changes, publish-application]
    if: |
      always() &&
      !failure() &&
      !cancelled() &&
      (needs.detect-changes.outputs.api == 'true' ||
       needs.detect-changes.outputs.application == 'true' ||
       needs.detect-changes.outputs.infra == 'true' ||
       needs.detect-changes.outputs.domain == 'true' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      NUGET_AUTH_TOKEN: ${{ secrets.NUGET_PAT }}
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore Shared.Api/Shared.Api.csproj

      - name: Build
        run: dotnet build Shared.Api/Shared.Api.csproj --configuration Release --no-restore

      - name: Pack
        run: dotnet pack Shared.Api/Shared.Api.csproj --configuration Release --no-build --output ./nupkg

      - name: Push
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --source "${{ env.GITHUB_FEED }}" \
            --api-key "${{ secrets.NUGET_PAT }}" \
            --skip-duplicate