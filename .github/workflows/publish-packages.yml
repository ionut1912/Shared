name: Publish NuGet Packages

on:
  push:
    branches: [master]
    paths:
      - 'Shared.Domain/**'
      - 'Shared.Infra/**'
      - 'Shared.Application/**'
      - 'Shared.Api/**'
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  GITHUB_FEED: https://nuget.pkg.github.com/ionut1912/index.json
  NUGET_AUTH_TOKEN: ${{ secrets.NUGET_PAT }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  packages: write
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      domain:      ${{ steps.domain.outputs.any_modified }}
      infra:       ${{ steps.infra.outputs.any_modified }}
      application: ${{ steps.application.outputs.any_modified }}
      api:         ${{ steps.api.outputs.any_modified }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 2

      - name: Detect Domain changes
        id: domain
        uses: tj-actions/changed-files@v46
        with:
          files: Shared.Domain/**

      - name: Detect Infra changes
        id: infra
        uses: tj-actions/changed-files@v46
        with:
          files: Shared.Infra/**

      - name: Detect Application changes
        id: application
        uses: tj-actions/changed-files@v46
        with:
          files: Shared.Application/**

      - name: Detect Api changes
        id: api
        uses: tj-actions/changed-files@v46
        with:
          files: Shared.Api/**

  publish:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.domain == 'true' ||
      needs.detect-changes.outputs.infra == 'true' ||
      needs.detect-changes.outputs.application == 'true' ||
      needs.detect-changes.outputs.api == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      NUGET_AUTH_TOKEN: ${{ secrets.NUGET_PAT }}
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore solution
        run: dotnet restore Shared.slnx

      - name: Build solution
        run: dotnet build Shared.slnx --configuration Release --no-restore

      - name: Pack Domain
        if: needs.detect-changes.outputs.domain == 'true' || github.event_name == 'workflow_dispatch'
        run: dotnet pack Shared.Domain/Shared.Domain.csproj --configuration Release --no-build --output ./nupkg

      - name: Pack Infra
        if: needs.detect-changes.outputs.infra == 'true' || github.event_name == 'workflow_dispatch'
        run: dotnet pack Shared.Infra/Shared.Infra.csproj --configuration Release --no-build --output ./nupkg

      - name: Pack Application
        if: needs.detect-changes.outputs.application == 'true' || github.event_name == 'workflow_dispatch'
        run: dotnet pack Shared.Application/Shared.Application.csproj --configuration Release --no-build --output ./nupkg

      - name: Pack Api
        if: needs.detect-changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
        run: dotnet pack Shared.Api/Shared.Api.csproj --configuration Release --no-build --output ./nupkg

      - name: Verify package contents
        run: |
          for f in ./nupkg/*.nupkg; do
            echo "=== $f ==="
            unzip -l "$f" | grep "lib/"
          done

      - name: Push all packages
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --source "${{ env.GITHUB_FEED }}" \
            --api-key "${{ secrets.NUGET_PAT }}" \
            --skip-duplicate